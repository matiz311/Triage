<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Triage • Service Desk</title>
<style>body{font:16px system-ui;background:#101927;color:#e7edf7;max-width:1100px;margin:40px auto;padding:20px}h1{font-size:42px}textarea{box-sizing:border-box;width:100%;height:230px;background:#1b293c;color:#fff;padding:18px;border:1px solid #536987;border-radius:12px}button{padding:14px 24px;background:#72e0b6;border:0;border-radius:8px;margin:16px 8px 16px 0;cursor:pointer}article{background:#1b293c;padding:20px;margin:15px 0;border-radius:12px}small{color:#afc0d9}pre{white-space:pre-wrap}label{display:block;margin:20px 0 10px}</style>
<h1>Triage <small>Service Desk</small></h1><p>Priorità motivate, scadenze e informazioni mancanti. Motore locale senza AI. Regole dimostrative da validare.</p>
<label for="tickets">Ticket normalizzati (JSON)</label><textarea id="tickets" spellcheck="false">[{"id":"DEMO-001","subject":"Verifica configurazione firewall per pagamenti","description":"Richiesta di verifica Palo Alto e VPN","priority":"Media","status":"Assegnato","site_id":"DEMO-SITE","asset_id":"DEMO-ASSET","assigned_to":"Demo"}]</textarea>
<button id="run">Analizza coda</button><button id="export" disabled>Esporta risultato</button><p id="status" role="status"></p><section id="results"></section>
<script>let output;const $=id=>document.getElementById(id);$('run').onclick=async()=>{try{$('status').textContent='Analisi…';const data=JSON.parse($('tickets').value);const res=await fetch('/api/triage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});output=await res.json();if(!res.ok)throw Error(output.error);$('results').replaceChildren();for(const r of output){const card=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('pre');h.textContent=r.id+' · '+r.score+'/100 · '+r.lane;p.textContent=JSON.stringify(r,null,2);card.append(h,p);$('results').append(card)}$('export').disabled=false;$('status').textContent=output.length+' ticket analizzati'}catch(e){$('status').textContent=e.message;$('export').disabled=true}};$('export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(output,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='triage.json';a.click();URL.revokeObjectURL(u)};</script></html>
