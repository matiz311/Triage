<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Triage • Service Desk</title>
<style>body{font:16px system-ui;background:#101927;color:#e7edf7;max-width:1100px;margin:40px auto;padding:20px}h1{font-size:42px}textarea{box-sizing:border-box;width:100%;height:230px;background:#1b293c;color:#fff;padding:18px;border:1px solid #536987;border-radius:12px}button{padding:12px 20px;background:#72e0b6;border:0;border-radius:8px;margin:12px 8px 12px 0;cursor:pointer}article{background:#1b293c;padding:20px;margin:15px 0;border-radius:12px}small{color:#afc0d9}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:15px/1.55 system-ui}label{display:block;margin:20px 0 10px}summary{cursor:pointer;padding:12px 0}select{padding:10px;background:#1b293c;color:white}</style>
<h1>Triage <small>Service Desk</small></h1><p>Problema → evidenze → diagnosi → azione. Procedure deterministiche, nessuna AI.</p>
<label for="procedure">Procedura tecnica da applicare al batch</label><select id="procedure"><option value="">Usa la procedura indicata in ogni ticket (altrimenti generica)</option><option value="network-flow">Verifica flussi di rete</option></select>
<label for="tickets">Ticket normalizzati (JSON)</label><textarea id="tickets" spellcheck="false">[{"id":"DEMO-001","subject":"Verifica flussi firewall pagamenti","description":"Richiesta di verifica Palo Alto e VPN","priority":"Media","status":"Assegnato","site_id":"DEMO-SITE","asset_id":"DEMO-ASSET","assigned_to":"Demo"}]</textarea>
<button id="run">Esegui triage</button><button id="export" disabled>Esporta JSON</button><p id="status" role="status"></p><section id="results"></section>
<script>
let output;const $=id=>document.getElementById(id);
function download(value,name,type){const u=URL.createObjectURL(new Blob([value],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
$('run').onclick=async()=>{output=null;$('export').disabled=true;$('results').replaceChildren();try{
$('status').textContent='Analisi…';const data=JSON.parse($('tickets').value);if(!Array.isArray(data))throw Error('Inserire una lista JSON di ticket');
if($('procedure').value)for(const t of data){if(!t||Array.isArray(t)||typeof t!=='object')throw Error('Ogni ticket deve essere un oggetto');t.technical={...(t.technical||{}),playbook_id:$('procedure').value}}
const res=await fetch('/api/triage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await res.json();if(!res.ok)throw Error(result.error);output=result;
for(const r of output){const card=document.createElement('article'),h=document.createElement('h2'),meta=document.createElement('p'),note=document.createElement('pre'),save=document.createElement('button'),details=document.createElement('details'),summary=document.createElement('summary'),raw=document.createElement('pre');
h.textContent=r.id+' · '+r.technical_report.phase;meta.textContent='Priorità di revisione '+r.score+'/100 · '+r.lane+' · Bozza interna';note.textContent=r.technical_report.note_text;
save.textContent='Scarica nota interna';save.onclick=()=>download(r.technical_report.note_text,'triage-nota.txt','text/plain');summary.textContent='Evidenze, regole e dati strutturati';raw.textContent=JSON.stringify(r,null,2);details.append(summary,raw);card.append(h,meta,note,save,details);$('results').append(card)}
$('export').disabled=false;$('status').textContent=output.length+' ticket analizzati. Le note sono bozze: nessuna pubblicazione nel portale.'
}catch(e){$('status').textContent=e.message}};
$('export').onclick=()=>download(JSON.stringify(output,null,2),'triage.json','application/json');
</script></html>
